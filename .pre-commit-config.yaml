# Local pre-commit hooks. CI is the authority - these exist so the same checks
# run before a commit rather than after it, which is cheaper than a failed
# Actions run.
#
# Install once:  pip install -r requirements-dev.txt && pre-commit install
#
# The parity check runs in offline mode here and live in CI. Offline is the
# right default locally: it is instant, needs no network, and the live diff is
# the same script.
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: python -m ruff check --fix
        language: system
        types: [python]
        pass_filenames: false

      - id: ruff-format
        name: ruff format
        entry: python -m ruff format
        language: system
        types: [python]
        pass_filenames: false

      - id: unit-tests
        name: unit tests
        entry: python -m unittest discover -s tests -t .
        language: system
        types: [python]
        pass_filenames: false

      - id: eval-gate
        name: eval gate
        entry: python evals/run_evals.py
        language: system
        types: [python]
        pass_filenames: false

      - id: vendored-parity
        name: vendored parser parity
        entry: python scripts/check_upstream_parity.py --offline
        language: system
        files: ^netverify/parsers/
        pass_filenames: false

      - id: mutation-test
        name: mutation test
        # Not in the default pre-commit path: it re-runs the whole suite once per
        # mutant, far too slow for every commit. It runs in CI on the default
        # branch. Invoke it by hand with: python scripts/mutation_test.py
        entry: "echo 'run: python scripts/mutation_test.py'"
        language: system
        files: ^scripts/mutation_test\.py$
        pass_filenames: false
