---

name: netverify CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nv-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Offline quality gate. Everything here runs with no network, no model, and no
  # secrets, so it is green on every commit rather than being skipped when a
  # credential is absent. That distinction is the whole point: a gate that cannot
  # run is indistinguishable from no gate.
  quality:
    name: Tests, Evals, Smoke (py${{ matrix.python-version }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the declared floor and runs the full suite. 3.12 is here
        # because the library claims support for it, and a claim that is never
        # tested is just a claim.
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the MCP extra
        run: python -m pip install --requirement requirements.txt

      - name: Lint
        run: |
          python -m pip install ruff==0.16.9
          ruff check .
          ruff format --check .

      - name: Verify the vendored parser has not drifted
        # Offline mode here on purpose: the live comparison is a separate job.
        # If the network check passed, the offline header check is redundant;
        # running it in both places means a network outage cannot quietly turn
        # the contract check into a no-op.
        run: python scripts/check_upstream_parity.py --offline

      - name: Run the test suite
        # stdlib unittest on purpose: no pytest install, no plugin discovery, and
        # identical behaviour on a laptop with nothing installed.
        run: python -m unittest discover -s tests -t . -v

      - name: Run the eval gate
        run: python evals/run_evals.py

      - name: Mutation test
        # Proves the suite has teeth. A suite that stays green when the security
        # code is wrong is the failure mode this catches, and coverage numbers
        # cannot tell you about it. Not run on every PR because it re-runs the
        # whole suite once per mutant; it runs on the default branch and on
        # manual dispatch.
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        run: python scripts/mutation_test.py

      - name: End-to-end MCP smoke test
        run: python scripts/smoke_test.py

      - name: Launch the real stdio server
        # The smoke test uses the in-memory transport, so it cannot catch a
        # server that starts and then corrupts stdout. This spawns the actual
        # process and speaks the protocol over a pipe, which is the only way to
        # prove stdout stayed clean.
        run: python scripts/stdio_check.py

  # Network-dependent drift check, kept separate so a GitHub outage fails one
  # job loudly instead of blocking the whole pipeline.
  parity:
    name: Vendored parity (live)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compare against the pinned upstream commit
        run: python scripts/check_upstream_parity.py

  security:
    name: Security gates
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install scanners
        run: python -m pip install bandit==1.9.4

      - name: Bandit
        # netverify/parsers is skipped on purpose: third-party code verified
        # byte-for-byte by the parity job, and reporting its issues as ours
        # would be noise. tests/ is excluded because assert-heavy test code is
        # not a production attack surface.
        run: bandit -r netverify server scripts -ll -x netverify/parsers

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'

  # F2 lives here and is intentionally not wired.
  #
  # The promptfoo trajectory eval needs a model API key, which means a secret,
  # which means a job that gets skipped on a fork or when the secret is unset -
  # the exact condition under which a green badge means nothing. The
  # deterministic gate in evals/ is what gates today, and this placeholder
  # records what F2 adds rather than pretending it already runs.
  #
  # F2 needs a PR secret named EVAL_MODEL_API_KEY, plus Langfuse self-hosted
  # tracing (docker compose) over the MCP server.
