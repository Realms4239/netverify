[project]
name = "netverify"
version = "1.0.0"
description = "Verify ISP backbone device output safely, with no credentials. Zero-dependency library plus a read-only MCP server."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["mcp", "network", "srl", "frr", "ospf", "bgp", "prompt-injection", "verification"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: System Administrators",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Networking",
  "Topic :: Security",
]

# The library itself needs NOTHING. That is a deliberate product decision, not
# an accident: `netverify` is meant to be vendored into a lab box, an air-gapped
# CI runner, or a 12GB machine on a bad power grid, and a dependency tree is a
# supply-chain surface in exactly that setting. The MCP server is the only part
# that needs anything, and it is an optional extra.
dependencies = []

[project.optional-dependencies]
mcp = ["mcp==2.2.0"]
dev = ["bandit==1.9.4", "ruff==0.16.9", "pytest==9.1.1"]

[project.scripts]
netverify = "server.app:main"

[project.urls]
Homepage = "https://github.com/Realms4239/netverify"
Source = "https://github.com/Realms4239/netverify"
Issues = "https://github.com/Realms4239/netverify/issues"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# `netverify` is the shipped library; `server` is the MCP adapter. Both are
# packaged, because `pip install netverify[mcp]` should give a working server
# and not require a git checkout.
packages = ["netverify", "netverify.parsers", "server"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["netverify/parsers"]

[tool.ruff.lint]
# E/W/F: pycodestyle and pyflakes. I: import sorting. B: bugbear.
# UP: pyupgrade. S: bandit-equivalent rules, so ruff alone already flags the
# security issues bandit would. Both run in CI on purpose: ruff is fast and
# broad, bandit is the tool an interviewer recognises.
select = ["E", "W", "F", "I", "B", "UP", "S"]
ignore = [
  "S101",  # assert - expected in tests
  "S603",  # subprocess - the scripts spawn python, deliberately
  "S607",  # partial executable path
]

[tool.ruff.lint.per-file-ignores]
# The vendored parser is not ours to restyle, exactly like ansible/collections
# in the sibling flagship repo. It is verified byte-for-byte by
# scripts/check_upstream_parity.py, which is a stronger check than lint.
"netverify/parsers/*" = ["ALL"]
"tests/*" = ["S101", "B011", "S404", "S603"]
# The sanitizer fixtures deliberately contain credential-shaped and
# injection-shaped strings, because testing the sanitizer requires payloads for
# it to catch. S105/S106 flag those as hardcoded secrets. The suppression is
# scoped to this one file; a real secret elsewhere still fails the build.
"tests/fixtures.py" = ["S105", "S106", "S107"]
# The property suite generates hostile input with a *seeded* PRNG. S311 warns
# that `random` is unfit for cryptography, which is true and irrelevant: a fixed
# seed is exactly what makes a fuzz failure reproducible rather than a flake
# that gets re-run until it passes. No secret is derived from it.
"tests/test_properties.py" = ["S311"]
# Same reasoning for the fake clock in the rate-limiter tests.
"tests/test_limits_audit.py" = ["S311"]
# models.py has an enum member literally named PASS. S105 reads the identifier as
# "hardcoded password", which it is not. The name is fixed by the Outcome enum's
# meaning and cannot be changed to satisfy a linter.
"netverify/models.py" = ["S105"]

[tool.ruff.lint.isort]
known-first-party = ["netverify", "server", "tests", "scripts", "evals"]

