[project]
name = "hardened-mcp-evals"
version = "0.1.0"
description = "Project F1: a read-only MCP tool that verifies ISP backbone device output, with an offline eval gate"
requires-python = ">=3.11"
dependencies = ["mcp==1.28.1"]

[tool.ruff]
# 100 rather than ruff's default 88: the fixtures and docstrings carry real
# vendor table output, and wrapping those for style would obscure them.
line-length = 100
target-version = "py311"
extend-exclude = ["server/vendor"]

[tool.ruff.lint]
# E/W/F: pycodestyle errors and warnings, pyflakes.
# I: import sorting.
# B: bugbear - catches the mutable-default and bare-except classes of bug.
# UP: pyupgrade - keeps the syntax modern for the declared 3.11 floor.
# S: bandit-equivalent rules, so `ruff` alone already flags the security
#   issues bandit would. Both run in CI on purpose: ruff is fast and broad,
#   bandit is the named tool an interviewer recognises.
select = ["E", "W", "F", "I", "B", "UP", "S"]
ignore = [
    # Tests deliberately call private helpers and reach into module internals
    # to assert on the contract; that is the point of a contract test.
    "S101",  # assert used - expected in tests
    "S603",  # subprocess - not used, but bandit-equivalent flags call sites
    "S607",  # partial executable path
]

[tool.ruff.lint.per-file-ignores]
# The vendored parser is not ours to restyle, exactly like ansible/collections
# in the sibling flagship repo. It is verified byte-for-byte by
# scripts/check_upstream_parity.py instead, which is a stronger check than lint.
"server/vendor/*" = ["ALL"]
"tests/*" = ["S101", "B011"]

[tool.ruff.lint.isort]
known-first-party = ["server", "tests", "scripts", "evals"]

[tool.bandit]
# exclude is handled via skips in CI rather than here, so the config stays
# visible and reviewable in one place.
exclude_dirs = ["server/vendor", "tests"]
